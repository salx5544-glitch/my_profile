<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Lobby</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: radial-gradient(circle at center, #3a1c71 0%, #0d0e15 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            transition: opacity 0.5s ease;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        .i {
            background: linear-gradient(to top, rgb(128, 0, 128), purple);
            border: 2px solid rgb(240, 2, 240);
            border-radius: 16px;
            padding: 10px 20px;
            box-shadow: 0 5px 15px rgb(240, 2, 240);
            cursor: pointer;
            text-decoration: none;
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            color: white;
            transition: 1s;
        }
        .i:hover {
            background: linear-gradient(to top, rgb(240, 2, 240), purple);
            transform: scale(1.1);
            box-shadow: 0 10px 20px rgb(240, 2, 240);
        }
    </style>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- FBXLoader -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <!-- Fflate for FBX decompression -->
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
</head>
<body>
    <header>
        <a href="index.html" class="i">العوده الى الصفحه الرئيسيه</a>
    </header>

    <div id="loading">جاري تحميل المشهد والقاعدة والحركة...</div>
    
    <div class="instructions">💡 اسحب بالماوس للتدوير حول الشخصية</div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');

        // 1. المشهد والكاميرا
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0d0e15, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 150, 350);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 2. أدوات التحكم
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 100, 0);

        // 3. الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(100, 300, 200);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const rimLight = new THREE.PointLight(0x00ffff, 3, 600);
        rimLight.position.set(-150, 200, -150);
        scene.add(rimLight);

        // 4. القاعدة الأنيقة والمتوهجة تحت الشخصية (بأبعاد تناسب مقياس FBX)
        const baseGeo = new THREE.CylinderGeometry(120, 140, 15, 64);
        const baseMat = new THREE.MeshStandardMaterial({ 
            color: 0x11131a, 
            roughness: 0.2,
            metalness: 0.8
        });
        const baseMesh = new THREE.Mesh(baseGeo, baseMat);
        baseMesh.position.y = -7.5;
        baseMesh.receiveShadow = true;
        scene.add(baseMesh);

        const ringGeo = new THREE.TorusGeometry(120, 3, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x9900ff });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        ringMesh.position.y = 0.5;
        scene.add(ringMesh);

        // 5. تحميل المجسم والحركة بصيغة FBX مع القاعدة
        let mixer;
        const clock = new THREE.Clock();
        const fbxLoader = new THREE.FBXLoader();

        fbxLoader.load('model.fbx', (object) => {
            scene.add(object);

            object.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                }
            });

            const box = new THREE.Box3().setFromObject(object);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            controls.target.copy(center);
            camera.position.set(center.x, center.y + size.y * 0.1, center.z + size.length() * 1.5);
            controls.update();

            mixer = new THREE.AnimationMixer(object);

            fbxLoader.load('SSS.fbx', (animFbx) => {
                if (animFbx.animations.length > 0) {
                    const clip = animFbx.animations[0];

                    clip.tracks.forEach((track) => {
                        track.name = track.name.replace('mixamorig', '');
                    });

                    const action = mixer.clipAction(clip);
                    action.reset();
                    action.play();
                }

                loadingEl.style.opacity = '0';
                setTimeout(() => loadingEl.remove(), 500);

            }, (xhr) => {
                if (xhr.lengthComputable) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingEl.innerText = `جاري تحميل الحركة... ${percent}%`;
                }
            }, (error) => {
                console.error('Error loading animation:', error);
                loadingEl.innerText = 'فشل تحميل ملف الحركة SSS.fbx!';
            });

        }, (xhr) => {
            if (xhr.lengthComputable) {
                const percent = Math.round((xhr.loaded / xhr.total) * 100);
                loadingEl.innerText = `جاري تحميل المجسم... ${percent}%`;
            }
        }, (error) => {
            console.error('Error loading model:', error);
            loadingEl.innerText = 'فشل تحميل المجسم model.fbx!';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
